stages:
  - generate
  - check
  - iteration
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Default job configurations (if needed)
default:
  cache:
    paths:
      - .cache/pip
      - .cache/npm
  before_script:
    - |
      # Only run Python-related commands for iteration or release jobs
      if [ "$RELEASE_JOB" == "true" ] || [ "$ITERATION_JOB" == "true" ]; then
        echo "Installing Python and setting up virtual environment for iteration or release jobs..."
        
        # Debugging Python version and pip version
        python --version
        pip --version
        
        # Install virtualenv
        pip install virtualenv
        
        # Create a virtual environment
        virtualenv venv
        
        # Activate the virtual environment
        source venv/bin/activate
        
        # Install Jira package
        pip install jira
      else
        echo "Skipping Python installation (not iteration or release job)"
      fi
# Sentry Automation Pipeline (Node.js jobs)
generate-commit-hashes:
  stage: generate
  image: node:latest
  tags:
    - shared-podman
  script:
    - |
      if curl -Lk --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_REF_NAME/raw/commit_hashes.json?job=check-file-job-node" \
        -o commit_hashes.json; then
        echo "Existing commit_hashes.json retrieved."
      else
        echo "No previous commit_hashes.json found. Initializing."
        echo "{}" > commit_hashes.json
      fi
    - echo "Contents of commit_hashes.json after generation:"
    - cat commit_hashes.json
  artifacts:
    paths:
      - commit_hashes.json
    expire_in: 90 days
  dependencies: []
  rules:
    - if: '$RUN_SENTRY_PIPELINE == "true"'
check-file-job-node:
  stage: check
  image: node:latest
  tags:
    - shared-podman
  dependencies:
    - generate-commit-hashes  # Use the artifact from the previous job
  script:
    - echo "Contents of commit_hashes.json before processing:"
    - cat commit_hashes.json
    - node scripts/checkFileChange.js  # Modify the contents of commit_hashes.json
    - echo "Contents of commit_hashes.json after processing:"
    - cat commit_hashes.json  # Print the updated contents
  artifacts:
    paths:
      - commit_hashes.json  # Save the updated artifact for the next job
    expire_in: 90 days
  rules:
    - if: '$RUN_SENTRY_PIPELINE == "true"'  # Only run if Sentry pipeline is triggered by the variable

# Other JIRA Pipeline (Python jobs)
add-iteration-job:
  stage: iteration
  image: python:3
  script:
    - python scripts/add-iteration.py
  tags: [shared-podman]
  when: always
  rules:
    - if: '$ITERATION_JOB == "true"'  # Only run if other jobs pipeline is triggered by the variable

list-release-job:
  stage: release
  image: python:3
  script:
    - python scripts/list-release.py
  tags: [shared-podman]
  when: always
  rules:
    - if: '$RELEASE_JOB == "true"'  # Only run if other jobs pipeline is triggered by the variable
