image: python:latest

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

stages:
  - iteration
  - release
  - check

default:
  cache:
    paths:
      - .cache/pip
      - .cache/npm
  before_script:
    - python --version ; pip --version  # For debugging
    - pip install virtualenv
    - virtualenv venv
    - source venv/bin/activate
    - pip install jira

# This is for the checkfile pipeline (runs independently)
check-file-job-node:
  stage: check
  image: node:latest
  script:
    - npm install
    - node scripts/checkFileChange.js
  tags: [shared-podman]
  when: manual  # Can still manually trigger this job, but it will also run according to the schedule

# Other jobs (iteration, release) - run together in their own pipeline
add-iteration-job:
  stage: iteration
  script:
    - python scripts/add-iteration.py
  tags: [shared-podman]
  when: always

list-release-job:
  stage: release
  script:
    - python scripts/list-release.py
  tags: [shared-podman]
  when: always
