stages:
  - generate
  - check
  - iteration
  - release

# Default job configurations (if needed)
default:
  cache:
    paths:
      - .cache/pip
      - .cache/npm
  before_script:
    - |
      # Only run Python-related commands for other jobs (not for Sentry automation)
      if [ "$RUN_OTHER_PIPELINE" == "true" ]; then
        echo "Installing Python for other jobs..."
        apt-get update && apt-get install -y python3 python3-pip  # Install Python and pip
        python3 --version  # Verify installation
        pip3 --version  # Verify pip installation
      else
        echo "Sentry pipeline: Skipping Python installation"
      fi

# Sentry Automation Pipeline (Node.js jobs)
generate-commit-hashes:
  stage: generate
  image: node:latest  # Using Node.js Docker image
  tags:
    - shared-podman
  script:
    - |
      if curl -Lk --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_REF_NAME/raw/commit_hashes.json?job=check-file-job-node" \
        -o commit_hashes.json; then
        echo "Existing commit_hashes.json retrieved."
      else
        echo "No previous commit_hashes.json found. Initializing."
        echo "{}" > commit_hashes.json
      fi
    - echo "Contents of commit_hashes.json after generation:"
    - cat commit_hashes.json

  artifacts:
    paths:
      - commit_hashes.json  # Save the artifact for use in next jobs
    expire_in: 90 days
  rules:
    - if: '$RUN_SENTRY_PIPELINE == "true"'  # Only run if Sentry pipeline is triggered by the variable

check-file-job-node:
  stage: check
  image: node:latest
  tags:
    - shared-podman
  dependencies:
    - generate-commit-hashes  # Use the artifact from the previous job
  script:
    - echo "Contents of commit_hashes.json before processing:"
    - cat commit_hashes.json
    - node scripts/checkFileChange.js  # Modify the contents of commit_hashes.json
    - echo "Contents of commit_hashes.json after processing:"
    - cat commit_hashes.json  # Print the updated contents
  artifacts:
    paths:
      - commit_hashes.json  # Save the updated artifact for the next job
    expire_in: 90 days
  rules:
    - if: '$RUN_SENTRY_PIPELINE == "true"'  # Only run if Sentry pipeline is triggered by the variable

# Other Jobs Pipeline (Python jobs)
add-iteration-job:
  stage: iteration
  image: python:3.9  # Use Python image for other jobs
  script:
    - python scripts/add-iteration.py
  tags: [shared-podman]
  when: always
  rules:
    - if: '$RUN_OTHER_PIPELINE == "true"'  # Only run if other jobs pipeline is triggered by the variable

list-release-job:
  stage: release
  image: python:3.9  # Use Python image for other jobs
  script:
    - python scripts/list-release.py
  tags: [shared-podman]
  when: always
  rules:
    - if: '$RUN_OTHER_PIPELINE == "true"'  # Only run if other jobs pipeline is triggered by the variable
